name: release

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging]

jobs:
  validate-feed:
    name: Validate source to staging
    runs-on: ubuntu-latest
    steps:
      - name: Check starting
        run: echo "::notice title=Validation in progress::Checking allowed source branches..."

      - name: Validate branch rules
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.ref }}"
            head="${{ github.event.pull_request.head.ref }}"
          else
            base="staging"
            head="${{ github.ref_name }}"
          fi

          if [ "$base" = "staging" ] && [ "$head" != "development" ] && [ "$head" != "staging" ]; then
            echo "::error title=Invalid source branch blocked::Merging into 'staging' is only allowed from the 'development' branch. Direct pushes to 'staging' are reserved for automated releases (e.g. semantic-release)."
            exit 1
          fi

          echo "::notice title=Source branch approved::Valid feed: '$head' to 'staging'"

      - name: Check failed
        if: failure()
        run: echo "::error title=Validation failed::Only 'development' can be merged into 'staging'"

      - name: Check passed
        if: success()
        run: echo "::notice title=Validation passed::Ready for release on push"

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: validate-feed
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Release job started
        run: echo "::notice title=Release started::Preparing to run semantic-release"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: echo "::notice title=Checkout complete::Repository with full history fetched"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: echo "::notice title=Node.js ready::v22.16.0 activated"

      - name: Install pnpm
        run: npm install -g pnpm
      - run: echo "::notice title=pnpm installed::Global installation complete"

      - name: Install dependencies
        run: pnpm install
      - run: echo "::notice title=Dependencies installed::pnpm install completed"

      - name: Run semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "::notice title=semantic-release running::Analyzing commits and publishing..."

      - name: Release failed
        if: failure()
        run: echo "::error title=Release failed::semantic-release encountered an error — check logs above"

      - name: Release succeeded
        if: success()
        run: echo "::notice title=Release published successfully::New version tagged, changelog updated, and release created"
